[project]
name = "enterprise-ai-platform"
version = "0.1.0"
description = "Enterprise AI Research & Intelligence Platform — hybrid RAG + agents + serving"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true   # many ML libs ship no stubs

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
